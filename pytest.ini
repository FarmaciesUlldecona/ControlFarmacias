[pytest]
testpaths = tests
norecursedirs = .git .venv tmp tmp_*
required_plugins = pytest-xdist==3.8.0
addopts = -n 8 --dist loadgroup
markers =
    pg17_local: integracion con PostgreSQL 17 local en Docker sin red (skip si no disponible)
    historica: ensayo de despliegue o rollback de una migracion ya desplegada (Hito SUITE; suite historica)
